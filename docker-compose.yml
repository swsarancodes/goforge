services:
  stackrender:
    build:
      context: .
      dockerfile: Dockerfile
    image: stackrender:latest
    container_name: stackrender
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - stackrender-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  stackrender-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: stackrender-api:latest
    container_name: stackrender-api
    restart: unless-stopped
    environment:
      - PORT=4000
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - MASTER_KEY=${STACKRENDER_MASTER_KEY}
      - CORS_ORIGIN=http://localhost:8080
      - SQLITE_PATH=/app/data/connections.db
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
