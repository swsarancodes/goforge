services:
  goforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: goforge:latest
    container_name: goforge
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - goforge-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  goforge-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: goforge-api:latest
    container_name: goforge-api
    restart: unless-stopped
    environment:
      - PORT=4000
      # Reachable only from the nginx container on the compose network; the port is not published.
      - HOST=0.0.0.0
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - MASTER_KEY=${GOFORGE_MASTER_KEY}
      - CORS_ORIGIN=http://localhost:8080
      - SQLITE_PATH=/app/data/connections.db
      # Optional: keep accounts, connections and diagrams in Postgres (see server/.env.example). Empty keeps the local SQLite file.
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_URL_POOLED=${DATABASE_URL_POOLED:-}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - MAX_CLOUD_DATABASES_PER_USER=${MAX_CLOUD_DATABASES_PER_USER:-10}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=true
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
