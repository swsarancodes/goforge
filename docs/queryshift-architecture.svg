<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">QueryShift: how a legacy query is converted, checked, corrected or sent to a human</title>
<desc id="d">A legacy Oracle query goes through the rule engine, a schema-mapping rename, a guarded read-only run, a comparison with the reference result, a held-out dataset and static checks. A failure becomes measured evidence for a model, which proposes a corrected query up to three times; otherwise the case goes to a human.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="1040" height="640" fill="#ffffff"/>
<rect x="20" y="16" width="994" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="517.0" y="38" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Inputs</text><text x="517.0" y="58" text-anchor="middle" font-size="11.5" fill="#0f172a">Legacy Oracle query · source schema · schema mapping (CSV) · target schema · business purpose · reference results for the primary and the held-out dataset</text>
<line x1="105" y1="80" x2="105" y2="112" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="112" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="105.0" y="134" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">1 · Rule engine</text><text x="105.0" y="154" text-anchor="middle" font-size="11.5" fill="#0f172a">Oracle syntax to PostgreSQL;</text><text x="105.0" y="170" text-anchor="middle" font-size="11.5" fill="#0f172a">reports behaviour traps</text><text x="105.0" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">it cannot fix</text><text x="105.0" y="202" text-anchor="middle" font-size="11.5" fill="#0f172a">(deterministic)</text>
<rect x="226" y="112" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="311.0" y="134" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">2 · Schema mapping</text><text x="311.0" y="154" text-anchor="middle" font-size="11.5" fill="#0f172a">Legacy table and column</text><text x="311.0" y="170" text-anchor="middle" font-size="11.5" fill="#0f172a">names to target names;</text><text x="311.0" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">keeps the output column</text><text x="311.0" y="202" text-anchor="middle" font-size="11.5" fill="#0f172a">names as aliases</text>
<rect x="432" y="112" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="517.0" y="134" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">3 · Guard + read-only run</text><text x="517.0" y="154" text-anchor="middle" font-size="11.5" fill="#0f172a">One SELECT only; READ ONLY</text><text x="517.0" y="170" text-anchor="middle" font-size="11.5" fill="#0f172a">transaction, rolled back;</text><text x="517.0" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">worker thread killed</text><text x="517.0" y="202" text-anchor="middle" font-size="11.5" fill="#0f172a">after 10 s</text>
<rect x="638" y="112" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="723.0" y="134" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">4 · Compare + invariants</text><text x="723.0" y="154" text-anchor="middle" font-size="11.5" fill="#0f172a">Rows as a multiset, NULL =</text><text x="723.0" y="170" text-anchor="middle" font-size="11.5" fill="#0f172a">NULL only, 6 decimals;</text><text x="723.0" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">counts and sums checked</text><text x="723.0" y="202" text-anchor="middle" font-size="11.5" fill="#0f172a">by independent SQL</text>
<rect x="844" y="112" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="929.0" y="134" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">5 · Held-out data</text><text x="929.0" y="154" text-anchor="middle" font-size="11.5" fill="#0f172a">A second dataset with its</text><text x="929.0" y="170" text-anchor="middle" font-size="11.5" fill="#0f172a">own reference result.</text><text x="929.0" y="186" text-anchor="middle" font-size="11.5" fill="#0f172a">No model is ever shown</text><text x="929.0" y="202" text-anchor="middle" font-size="11.5" fill="#0f172a">anything measured here</text>
<line x1="190" y1="158" x2="226" y2="158" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="396" y1="158" x2="432" y2="158" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="602" y1="158" x2="638" y2="158" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="808" y1="158" x2="844" y2="158" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="620" y="104" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">attempt 0 is the rule engine&#8217;s query; attempts 1–3 are corrections</text>
<rect x="394" y="270" width="170" height="92" rx="8" fill="#fff1d6" stroke="#d97706" stroke-width="1.5"/><text x="479.0" y="292" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Model proposer</text><text x="479.0" y="312" text-anchor="middle" font-size="11.5" fill="#0f172a">gpt-5.6-luna via the policy</text><text x="479.0" y="328" text-anchor="middle" font-size="11.5" fill="#0f172a">and audit layer. Sees schema,</text><text x="479.0" y="344" text-anchor="middle" font-size="11.5" fill="#0f172a">mapping and evidence; returns</text><text x="479.0" y="360" text-anchor="middle" font-size="11.5" fill="#0f172a">a corrected query, no verdict</text>
<rect x="620" y="270" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="705.0" y="292" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Evidence (measured)</text><text x="705.0" y="312" text-anchor="middle" font-size="11.5" fill="#0f172a">rows missing / unexpected,</text><text x="705.0" y="328" text-anchor="middle" font-size="11.5" fill="#0f172a">columns that differ,</text><text x="705.0" y="344" text-anchor="middle" font-size="11.5" fill="#0f172a">PostgreSQL error,</text><text x="705.0" y="360" text-anchor="middle" font-size="11.5" fill="#0f172a">broken invariants, findings</text>
<rect x="844" y="270" width="170" height="92" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.5"/><text x="929.0" y="292" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">6 · Static checks</text><text x="929.0" y="312" text-anchor="middle" font-size="11.5" fill="#0f172a">Parsed SQL, schema and</text><text x="929.0" y="328" text-anchor="middle" font-size="11.5" fill="#0f172a">legacy query; nine findings,</text><text x="929.0" y="344" text-anchor="middle" font-size="11.5" fill="#0f172a">one blocking: a query that</text><text x="929.0" y="360" text-anchor="middle" font-size="11.5" fill="#0f172a">matches only by fitting</text>
<line x1="705" y1="204" x2="705" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="713" y="240" text-anchor="start" font-size="11" fill="#334155" font-style="italic">fail / error</text>
<line x1="620" y1="316" x2="564" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="592" y="308" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">evidence</text>
<line x1="479" y1="270" x2="479" y2="204" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="487" y="244" text-anchor="start" font-size="11" fill="#334155" font-style="italic">corrected query (at most 3)</text>
<line x1="844" y1="316" x2="790" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="817" y="308" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">suspects</text>
<line x1="929" y1="204" x2="929" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="937" y="244" text-anchor="start" font-size="11" fill="#334155" font-style="italic">passes 4 and 5</text>
<line x1="929" y1="362" x2="929" y2="452" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="937" y="410" text-anchor="start" font-size="11" fill="#334155" font-style="italic">no blocking finding</text>
<rect x="20" y="452" width="560" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="300.0" y="474" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Needs human review</text><text x="300.0" y="494" text-anchor="middle" font-size="11.5" fill="#0f172a">Typed reasons: budget used up · no model configured · model call failed · same query again ·</text><text x="300.0" y="510" text-anchor="middle" font-size="11.5" fill="#0f172a">query reproduces the evidence · guard refused it · fails the held-out data ·</text><text x="300.0" y="526" text-anchor="middle" font-size="11.5" fill="#0f172a">blocking static finding · bind variables. The reviewer gets the evidence and every attempt.</text>
<rect x="600" y="452" width="220" height="92" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="710.0" y="474" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Trace (JSON)</text><text x="710.0" y="494" text-anchor="middle" font-size="11.5" fill="#0f172a">Every attempt: SQL, verdict,</text><text x="710.0" y="510" text-anchor="middle" font-size="11.5" fill="#0f172a">evidence, findings, held-out</text><text x="710.0" y="526" text-anchor="middle" font-size="11.5" fill="#0f172a">result, model usage, reasons</text>
<rect x="844" y="452" width="170" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="929.0" y="474" text-anchor="middle" font-weight="700" font-size="13" fill="#0f172a">Verified</text><text x="929.0" y="494" text-anchor="middle" font-size="11.5" fill="#0f172a">matched the primary and</text><text x="929.0" y="510" text-anchor="middle" font-size="11.5" fill="#0f172a">the held-out data, with no</text><text x="929.0" y="526" text-anchor="middle" font-size="11.5" fill="#0f172a">blocking finding</text>
<line x1="660" y1="362" x2="330" y2="452" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="470" y="396" text-anchor="middle" font-size="11" fill="#334155" font-style="italic">any escalation</text>
<rect x="20" y="580" width="14" height="14" rx="3" fill="#e0ecff" stroke="#2563eb"/><text x="40" y="592" font-size="11.5" fill="#0f172a">deterministic</text>
<rect x="140" y="580" width="14" height="14" rx="3" fill="#fff1d6" stroke="#d97706"/><text x="160" y="592" font-size="11.5" fill="#0f172a">model-assisted</text>
<rect x="270" y="580" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="290" y="592" font-size="11.5" fill="#0f172a">verified</text>
<rect x="360" y="580" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="380" y="592" font-size="11.5" fill="#0f172a">human review</text>
<text x="20" y="620" font-size="11.5" fill="#334155">The model is only ever asked for a corrected query. Whether a query is right is decided by steps 3–6 and nothing else.</text>
</svg>